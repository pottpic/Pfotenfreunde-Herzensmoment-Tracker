<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pottpic Gutschein</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#1a120b;--bark:#3d2c1e;--wood:#7c5235;--amber:#e07b2a;--gold:#f5a623;--cream:#fdf7ef;--warm:#f3e8d8;--paper:#fffcf7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;background:#e9dfd1;color:var(--ink);padding:16px}
.hand{font-family:"Caveat",cursive;font-weight:700}
.tool{max-width:820px;margin:0 auto 16px;background:var(--paper);border-radius:14px;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tool h1{grid-column:1/-1;font-size:1.1rem;color:var(--bark)}
.tool p{grid-column:1/-1;font-size:.85rem;color:var(--wood)}
.tool label{font-size:.78rem;font-weight:700;color:var(--wood);display:flex;flex-direction:column;gap:4px}
.tool input,.tool select{padding:9px;border:1.5px solid var(--warm);border-radius:9px;font-size:.95rem}
.tool button{grid-column:1/-1;padding:13px;border:none;border-radius:999px;background:var(--amber);color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.card{max-width:820px;aspect-ratio:297/210;margin:0 auto;background:var(--paper);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.18);display:grid;grid-template-columns:38% 62%;overflow:hidden}
.left{background:linear-gradient(160deg,var(--bark),var(--wood));color:#fff;padding:7% 8%;display:flex;flex-direction:column;justify-content:space-between}
.brand{font-weight:900;font-size:clamp(1rem,3vw,1.6rem);letter-spacing:.03em}.brand span{color:var(--gold)}
.brand small{display:block;font-size:.42em;opacity:.8;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.big{font-size:clamp(2rem,7vw,3.8rem);line-height:.95;color:var(--gold)}
.paw{font-size:clamp(1.4rem,4vw,2.4rem);opacity:.85}
.right{padding:6% 7%;display:flex;flex-direction:column;justify-content:center;gap:clamp(6px,1.6vw,14px);background:radial-gradient(circle at 90% 10%,rgba(245,166,35,.15),transparent 40%),var(--paper)}
.lbl{font-size:clamp(.55rem,1.3vw,.75rem);text-transform:uppercase;letter-spacing:.12em;color:var(--wood);font-weight:700}
.val{font-size:clamp(1.3rem,4vw,2.3rem);color:var(--bark);line-height:1.05}
.paket{font-size:clamp(.95rem,2.6vw,1.4rem);color:var(--amber);font-weight:800}
.desc{font-size:clamp(.7rem,1.8vw,.95rem);color:var(--wood)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:clamp(.55rem,1.4vw,.75rem);color:var(--wood);border-top:1.5px dashed var(--warm);padding-top:clamp(6px,1.4vw,12px);margin-top:auto}
@media print{
  @page{size:A4 landscape;margin:0}
  body{background:#fff;padding:0}
  .tool{display:none}
  .card{max-width:none;width:297mm;height:210mm;aspect-ratio:auto;border-radius:0;box-shadow:none;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<form class="tool" onsubmit="event.preventDefault();window.print()">
  <h1>🎁 Gutschein ausfüllen (nur für Moni)</h1>
  <p>Felder ausfüllen, dann „Drucken / als PDF speichern“ und im Druckfenster „Als PDF speichern“ wählen. Das PDF schickst du nach Zahlungseingang raus.</p>
  <label>Für (Hund und/oder Mensch)<input id="fFuer" value="Bruno & Sabine"></label>
  <label>Von<input id="fVon" value="Deiner Schwester"></label>
  <label>Paket<select id="fPaket">
    <option value="kleines">Kleines Glück</option>
    <option value="herz">Herzensmoment</option>
    <option value="wert">Wertgutschein</option>
  </select></label>
  <label>Wert (nur bei Wertgutschein)<input id="fWert" value="50 €"></label>
  <label>Gutschein-Nr.<input id="fNr" value="PP-2026-001"></label>
  <label>Gültig bis<input id="fBis" value="31.12.2027"></label>
  <button type="submit">Drucken / als PDF speichern</button>
</form>

<div class="card">
  <div class="left">
    <div class="brand">POTT<span>PIC</span><small>Hundefotografie im Ruhrgebiet</small></div>
    <div class="big hand">Gutschein</div>
    <div class="paw">🤎</div>
  </div>
  <div class="right">
    <div><div class="lbl">Für</div><div class="val hand" id="oFuer"></div></div>
    <div class="paket" id="oPaket"></div>
    <div class="desc" id="oDesc"></div>
    <div><div class="lbl">Von</div><div class="val hand" id="oVon" style="font-size:clamp(1rem,3vw,1.7rem)"></div></div>
    <div class="meta"><span id="oNr"></span><span id="oBis"></span><span>pottpic.de</span></div>
  </div>
</div>

<script>
const PAKETE = {
  kleines:{name:"Kleines Glück", desc:"30 Minuten Hundeshooting und 5 bearbeitete Lieblingsbilder. Termin sucht ihr euch zusammen mit Moni aus."},
  herz:{name:"Herzensmoment", desc:"60 Minuten Hundeshooting am Lieblingsort und 12 bearbeitete Lieblingsbilder. Gern auch mit Mensch mit drauf."},
  wert:{name:"", desc:"Einlösbar für ein Hundeshooting oder Bilder bei Pottpic. Termin sucht ihr euch zusammen mit Moni aus."}
};
const ids = ["fFuer","fVon","fPaket","fWert","fNr","fBis"];
function upd(){
  const g = id => document.getElementById(id).value;
  const p = PAKETE[g("fPaket")];
  document.getElementById("oFuer").textContent = g("fFuer");
  document.getElementById("oVon").textContent = g("fVon");
  document.getElementById("oPaket").textContent = g("fPaket")==="wert" ? "Wertgutschein über " + g("fWert") : "„" + p.name + "“";
  document.getElementById("oDesc").textContent = p.desc;
  document.getElementById("oNr").textContent = "Nr. " + g("fNr");
  document.getElementById("oBis").textContent = "gültig bis " + g("fBis");
  document.getElementById("fWert").parentElement.style.display = g("fPaket")==="wert" ? "" : "none";
}
ids.forEach(id => document.getElementById(id).addEventListener("input", upd));
upd();
</script>
</body>
</html>
